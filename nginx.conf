# EcoTech Exchange - Enterprise Reverse Proxy Configuration
# Phase 7: Forward vs Reverse Proxy Integration

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    # --- PHASE 7: RATE LIMITING (Protect against DDoS) ---
    # Limits requests to 10 per second per IP
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

    # --- PHASE 7: MICRO-CACHING (Cache Stampede Mitigation) ---
    # Caches identical requests directly at the Nginx layer for 2 seconds.
    proxy_cache_path ./nginx_cache levels=1:2 keys_zone=api_cache:10m max_size=100m inactive=60m use_temp_path=off;

    upstream ecotech_backend {
        server 127.0.0.1:8001;
        server 127.0.0.1:8002;
        server 127.0.0.1:8003;
    }

    server {
        listen 8000;
        server_name localhost;

        # --- PHASE 7: SECURITY HEADERS (Server Identity Protection) ---
        add_header X-Frame-Options "SAMEORIGIN";
        add_header X-XSS-Protection "1; mode=block";
        add_header X-Content-Type-Options "nosniff";
        server_tokens off; # Hides the Nginx version from attackers

        location / {
            # Apply rate limiting to all endpoints
            limit_req zone=api_limit burst=20 nodelay;

            proxy_pass http://ecotech_backend;
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # --- PHASE 7: ADVANCED CACHING STRATEGY ---
        # Apply Micro-caching specifically to the heavily-requested equipment GET endpoint
        location /equipment {
            limit_req zone=api_limit burst=20 nodelay;
            
            proxy_cache api_cache;
            proxy_cache_methods GET;
            proxy_cache_valid 200 2s; # Micro-cache for 2 seconds to absorb stampedes
            proxy_cache_use_stale updating error timeout invalid_header http_500 http_502 http_503 http_504;
            proxy_cache_background_update on; # Background Refresh Strategy
            proxy_cache_lock on; # Mutex at Nginx level

            proxy_pass http://ecotech_backend;
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
